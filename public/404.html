<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraCity — Page Not Found</title>
  </head>
  <body>
    <script type="text/javascript">
      // Single Page App fallback for GitHub Pages
      // Redirects all 404s to index.html so React Router can handle the route
      const path = window.location.pathname
      const base = '/AuraCity/'
      const url = base + 'index.html#' + path
      window.location.replace(url)
    </script>
  </body>
</html>
